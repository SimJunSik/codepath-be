version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: codepath-postgres
    environment:
      POSTGRES_USER: codepath
      POSTGRES_PASSWORD: codepath123
      POSTGRES_DB: codepath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepath"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codepath-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codepath-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codepath-network

  # Backend API (Optional - for development)
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: codepath-backend
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://codepath:codepath123@postgres:5432/codepath
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./app:/app/app
  #   networks:
  #     - codepath-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  codepath-network:
    driver: bridge
